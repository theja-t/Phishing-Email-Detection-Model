[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-email-detector"
version = "0.1.0"
description = "A starter machine-learning project for classifying phishing emails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
phishing-detector = "phishing_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
